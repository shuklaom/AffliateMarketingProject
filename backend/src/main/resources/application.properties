# ──────────────────────────────────────────────────────────────────────
#  Everyday Deals – Spring Boot application configuration
#
#  Sensitive values are supplied via environment variables.
#  Copy this file to application.properties and never commit secrets.
# ──────────────────────────────────────────────────────────────────────

# Server
server.port=${SERVER_PORT:8080}

# ── MySQL datasource ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/everydaydeals?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Jackson ───────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── CORS (override in prod) ───────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Admin API security ────────────────────────────────────────────────
# Set ADMIN_API_KEY env var to a strong random secret in production.
# POST / PUT / DELETE /api/products require: X-Admin-Key: <value>
admin.api-key=${ADMIN_API_KEY:}

# ── Actuator (optional health endpoint) ──────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
